<rect class="b" x="55" y="360" width="250" height="120" fill="#f6ffed" stroke="#52a447"/><text class="h" x="180" y="400">Qwen Cloud API</text><text class="s" x="180" y="435">DashScope-compatible</text><text class="s" x="180" y="460">chat API</text>
