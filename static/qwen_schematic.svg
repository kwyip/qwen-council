<rect width="1400" height="850" fill="white"/><text x="700" y="50" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="700" fill="#0b63ce">Qwen Councils · AI Infrastructure</text>
<g text-anchor="middle"><rect class="b" x="40" y="120" width="240" height="125" fill="#f6ffed" stroke="#52a447"/><text class="h" x="160" y="160">Web Browser</text><text class="s" x="160" y="192">HTML + KaTeX</text><text class="s" x="160" y="218">qouncil.org</text>
<rect class="b" x="360" y="120" width="240" height="125" fill="#f6ffed" stroke="#52a447"/><text class="h" x="480" y="160">Cloudflare</text><text class="s" x="480" y="192">DNS &amp; SSL proxy</text><text class="s" x="480" y="218">Full Strict Mode</text>
<rect x="680" y="82" width="680" height="500" rx="24" fill="#eef8ff" stroke="#1890ff" stroke-width="4"/><text x="1020" y="118" font-family="sans-serif" font-size="23" font-weight="700" fill="#1261a0">Alibaba Cloud Simple Application Server (SAS)</text>
<rect class="b" x="730" y="160" width="240" height="120" fill="white" stroke="#1890ff"/><text class="h" x="850" y="198">Nginx</text><text class="s" x="850" y="230">Reverse proxy · SSL</text><text class="s" x="850" y="254">ports 80 / 443</text>
<rect class="b" x="1070" y="160" width="240" height="120" fill="white" stroke="#1890ff"/><text class="h" x="1190" y="198">Gunicorn</text><text class="s" x="1190" y="230">WSGI · 3 workers</text><text class="s" x="1190" y="254">port 8000</text>
<rect class="b" x="1070" y="370" width="240" height="120" fill="white" stroke="#1890ff"/><text class="h" x="1190" y="408">Flask App</text><text class="s" x="1190" y="440">qwen-council</text><text class="s" x="1190" y="464">ProxyFix</text>
